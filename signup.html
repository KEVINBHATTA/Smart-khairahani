<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Municipality Signup</title>
<link rel="stylesheet" href="style.css" />

<style>
body {
  font-family: "Poppins", sans-serif;
  background: linear-gradient(135deg, #0077b6, #00b4d8);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  background: #fff;
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  width: 400px;
}
.container h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #023e8a;
}
.form-group {
  margin-bottom: 15px;
}
label {
  display: block;
  margin-bottom: 6px;
  color: #03045e;
  font-weight: 600;
}
input, select {
  width: 100%;
  padding: 10px;
  border: 1px solid #90e0ef;
  border-radius: 8px;
  outline: none;
  font-size: 14px;
}
button {
  width: 100%;
  background: #0077b6;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.3s;
}
button:hover {
  background: #023e8a;
}
.hidden {
  display: none;
}
.error {
  color: red;
  text-align: center;
  margin-top: 10px;
}
.success {
  color: green;
  text-align: center;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="container">
  <h2>Create Account</h2>
  
  <div class="form-group">
    <label for="role">Select Role</label>
    <select id="role" required>
      <option value="citizen">Citizen</option>
      <option value="ward">Ward</option>
      <option value="municipality">Municipality</option>
    </select>
  </div>

  <div id="commonFields">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Enter your name" required />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" required />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" required />
    </div>
  </div>

  <div id="citizenFields">
    <div class="form-group">
      <label>Citizenship Number</label>
      <input type="text" id="citizenship" placeholder="Enter citizenship number" required />
    </div>
  </div>

  <div id="wardFields" class="hidden">
    <div class="form-group">
      <label>Ward ID</label>
      <input type="text" id="wardId" placeholder="Enter ward number" />
    </div>
    <div class="form-group">
      <label>Ward Code</label>
      <input type="text" id="wardCode" placeholder="Enter ward code" />
    </div>
  </div>

  <div id="municipalityFields" class="hidden">
    <div class="form-group">
      <label>Municipality Code</label>
      <input type="text" id="municipalityCode" placeholder="Enter municipality code" />
    </div>
  </div>

  <button id="signupBtn">Sign Up</button>
  <div id="message"></div>
</div>

<script type="module">
// Firebase imports
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

// Your Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBvpzCT0Buw9DwvIOFw-ndWbjNlId0mym0",
  authDomain: "growx-more.firebaseapp.com",
  projectId: "growx-more",
  storageBucket: "growx-more.firebasestorage.app",
  messagingSenderId: "650882173754",
  appId: "1:650882173754:web:24edd80fe83731ffc69e03",
  measurementId: "G-5E58GBS8V8"
};


// Init Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// DOM elements
const role = document.getElementById("role");
const citizenFields = document.getElementById("citizenFields");
const wardFields = document.getElementById("wardFields");
const municipalityFields = document.getElementById("municipalityFields");
const signupBtn = document.getElementById("signupBtn");
const message = document.getElementById("message");

// Toggle fields based on role
role.addEventListener("change", () => {
  citizenFields.classList.toggle("hidden", role.value !== "citizen");
  wardFields.classList.toggle("hidden", role.value !== "ward");
  municipalityFields.classList.toggle("hidden", role.value !== "municipality");
});

// Signup logic
signupBtn.addEventListener("click", async () => {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const citizenship = document.getElementById("citizenship").value.trim();
  const wardId = document.getElementById("wardId").value.trim();
  const wardCode = document.getElementById("wardCode").value.trim();
  const municipalityCode = document.getElementById("municipalityCode").value.trim();
  const userRole = role.value;

  message.textContent = "";
  message.className = "";

  try {
    if (userRole === "citizen") {
      const docRef = doc(db, "citizenshipNumbers", citizenship);
      const docSnap = await getDoc(docRef);

      if (!docSnap.exists()) {
        message.textContent = "❌ Unregistered citizenship number!";
        message.className = "error";
        return;
      }
    }

    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const uid = userCredential.user.uid;

    await setDoc(doc(db, "users", uid), {
      name, email, role: userRole, citizenship, wardId, wardCode, municipalityCode,
      createdAt: new Date().toISOString()
    });

    message.textContent = "✅ Signup successful! Redirecting...";
    message.className = "success";

    // ✅ Redirect after 2 seconds
    setTimeout(() => {
      window.location.href = "login.html";
    }, 2000);

  } catch (err) {
    console.error(err);
    message.textContent = "⚠️ " + err.message;
    message.className = "error";
  }
});
</script>
</body>
</html>
